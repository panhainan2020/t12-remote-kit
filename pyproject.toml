[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t12-remote-kit"
version = "0.1.0"
description = "Internal reusable T12/R12 serial decoding and calibration tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
  "pyserial>=3.5",
]

[project.scripts]
t12-monitor = "t12_remote.serial:main"
t12-detect = "t12_remote.mapping_detector:main"

[tool.setuptools.packages.find]
where = ["src"]

